# Линтер бэкенда (CI: `ruff check .` из backend/). Минимальный набор: ошибки pycodestyle, pyflakes, предупреждения.
target-version = "py311"
line-length = 120

[lint]
# C901 / PLR0915 — сложность (> 12 ветвлений) и длина (> 50 операторов) функций: новый код не разрастается.
select = ["E", "F", "W", "C901", "PLR0915"]
# Длинные строки (SQL, сообщения об ошибках) не блокируют: форматирование не навязываем существующему коду.
ignore = ["E501"]

[lint.mccabe]
max-complexity = 12

[lint.per-file-ignores]
# Существующие сложные функции — долг на рефакторинг, не новый код: снять исключение после разбиения.
"app/api/middleware.py" = ["C901"]   # BoundaryMiddleware.__call__
"app/audit/exposure.py" = ["C901"]   # _account_total
"app/audit/verify.py" = ["C901"]     # diff
"app/sync/store.py" = ["C901"]       # write_snapshot
"evals/golden.py" = ["C901"]         # gate
# Фикстуры pytest импортируются из соседних модулей и подставляются по имени параметра:
# импорт выглядит неиспользуемым (F401), а параметр — переопределением импорта (F811).
# Сценарные тесты длинные по природе — длину и сложность в них не ограничиваем.
"tests/**" = ["F401", "F811", "C901", "PLR0915"]
