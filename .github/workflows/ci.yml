# CI: линт, тесты, миграции, секреты и уязвимые зависимости. Все задачи блокирующие: чтобы красный
# pipeline запрещал merge, отметьте их как required status checks в branch protection (см. отчёт / README).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, migrations, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Тесты подключаются ролями app_* без пароля (tests/conftest.py): только для одноразовой БД CI.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Суперпользователь: conftest создаёт роли кластера и тестовые БД.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Migrations reproduce schema.sql
        run: python -m pytest -q -p no:cacheprovider tests/test_migrations.py
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_migrations.py

  frontend:
    name: frontend (lint, build, headers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Браузерная часть проверки (нарушения CSP в консоли) обязательна: без Playwright шаг падает, а не пропускается.
      - name: Install Playwright (Chromium)
        run: npm i -g playwright@1.56.1 && npx -y playwright@1.56.1 install --with-deps chromium
      - name: Security headers
        run: npm run test:headers
        env:
          REQUIRE_BROWSER: "1"

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # вся история: секрет, удалённый в следующем коммите, всё равно утёк
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # go install проверяет модуль по sum.golang.org — без скачивания бинаря и без лицензии gitleaks-action.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan git history
        run: "$(go env GOPATH)/bin/gitleaks git --redact --no-banner --verbose ."

  dependencies:
    name: dependencies (pip-audit, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # Блокирует любая известная уязвимость (у PyPI-advisory нет единой шкалы severity). Исключение — только
      # осознанное: --ignore-vuln <ID> с комментарием, почему не применимо.
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements-dev.txt
      - name: npm audit (high and critical block)
        working-directory: frontend
        run: npm audit --audit-level=high --package-lock-only
